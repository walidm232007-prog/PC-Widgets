# Builds PC Widgets.exe and its installer, tests both, and publishes a release.
#
# - Push a tag like v1.0.0 (matching widgets/version.py): build, test, and a
#   GitHub Release with the installer attached.
# - Run it by hand (Actions -> Release -> Run workflow): build and test only,
#   the installer kept as a workflow artifact for a week. Do this before
#   tagging, to see a build pass on a clean machine.
#
# packaging/README.md explains the build itself.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build tools
        run: python -m pip install --disable-pip-version-check -r packaging/requirements.txt

      - name: Inno Setup
        shell: pwsh
        run: |
          # The installer's look needs Inno Setup 6.7 or newer (pc-widgets.iss
          # checks). The runner's own copy is used when it is new enough;
          # otherwise 6.7.3 is installed from Inno Setup's GitHub release,
          # checked against the SHA-256 in winget's manifest for that version.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $probe = Join-Path $env:RUNNER_TEMP "inno-version.iss"
          Set-Content -Path $probe -Encoding ascii -Value @(
            '#if Ver < EncodeVer(6, 7, 0)', '  #error Inno Setup is older than 6.7', '#endif',
            '[Setup]', 'AppName=probe', 'AppVersion=1', 'DefaultDirName={tmp}', 'Output=no')
          $ready = $false
          if (Test-Path $iscc) { & $iscc /Q $probe | Out-Null; $ready = ($LASTEXITCODE -eq 0) }
          if (-not $ready) {
            $setup = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
            Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $setup
            $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
            if ($hash -ne "9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732") {
              throw "the Inno Setup 6.7.3 download has SHA-256 $hash"
            }
            Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/ALLUSERS" -Wait
            & $iscc /Q $probe | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup 6.7 did not install" }
          }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path widgets/version.py -Pattern 'VERSION = "([\d.]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "tag $env:GITHUB_REF_NAME doesn't match widgets/version.py ($v)"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build and test
        run: python tools/build_exe.py --out build --installer

      - name: Self-test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: selftest-log
          path: build/test-localappdata/PCWidgets/_selftest/selftest.log
          if-no-files-found: ignore

      - name: Keep the installer
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: PC-Widgets-Setup-${{ steps.version.outputs.version }}
          path: build/PC-Widgets-Setup-${{ steps.version.outputs.version }}.exe
          retention-days: 7

      - name: Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:VERSION
          $setup = "build/PC-Widgets-Setup-$v.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $notes = @"
          **Download PC-Widgets-Setup-$v.exe below and run it.** Windows 10 or 11, 64-bit. No admin needed, and nothing else to install.

          The installer isn't signed yet, so the first time Windows may say "Windows protected your PC": click **More info**, then **Run anyway**.

          To update, run a newer installer over this one; your widgets and settings stay. Uninstall from Settings -> Apps.

          SHA-256: ``$hash``
          "@
          gh release create $env:GITHUB_REF_NAME $setup --title "PC Widgets $v" --notes $notes
